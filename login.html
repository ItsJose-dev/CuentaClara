<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | CuentaClara</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-layout">

    <aside class="brand-panel">
      <h1 class="brand-name">CuentaClara</h1>
      <p class="brand-tagline">Tus créditos y cobranzas, siempre claros.</p>
    </aside>

    <main class="form-panel">
      <div class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form id="login-form">
          <div class="field">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="ej. admin.plataforma" autocomplete="username">
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          </div>

          <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>

          <button type="submit" class="btn-login">Ingresar al sistema</button>
        </form>
      </div>
    </main>

  </div>
</body>
</html>
